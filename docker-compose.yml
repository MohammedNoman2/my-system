services:
  postgres:
    image: postgres:16-alpine
    container_name: arp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arp_user
      POSTGRES_PASSWORD: arp_password_secure_2026
      POSTGRES_DB: arp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arp_user -d arp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: arp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arp_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://arp_user:arp_password_secure_2026@postgres:5432/arp_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=arp-production-ultra-secret-key-2026-deployment
      - CSRF_SECRET_KEY=arp-csrf-secret-2026
      - FRONTEND_URL=http://localhost
      - UPLOAD_DIR=/app/uploads
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: arp_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_uploads:
